name: Sync firmware from releases

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest binaries (bootloader/partitions/firmware)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          sync_repo () {
            local repo="$1"
            local dest="firmware/$2"
            mkdir -p "$dest"
            gh release download --repo "$repo" -p "*-bootloader.bin" -O "$dest/bootloader.bin" --clobber
            gh release download --repo "$repo" -p "*-partitions.bin" -O "$dest/partitions.bin" --clobber
            gh release download --repo "$repo" -p "*-lilygo-t-display-s3-v*.bin" -O "$dest/firmware.bin" --clobber
            gh release view --repo "$repo" --json tagName -q .tagName > "$dest/VERSION"
          }
          sync_repo UniqueDroid/pfsense-status-esp32 pfsense-status-esp32
          sync_repo UniqueDroid/fritzbox-status-esp32 fritzbox-status-esp32

          # PicoRead's release assets are unprefixed (bootloader.bin/partitions.bin/firmware.bin
          # directly) since that repo only targets one board - no glob needed.
          # Soft-fail until the first real release exists there (release.yml only
          # just started publishing real GitHub Releases instead of CI artifacts) -
          # `set -e` would otherwise abort this whole step, taking pfsense/fritzbox
          # sync down with it.
          if gh release view --repo UniqueDroid/PicoRead >/dev/null 2>&1; then
            mkdir -p firmware/picoread
            gh release download --repo UniqueDroid/PicoRead -p "bootloader.bin" -O firmware/picoread/bootloader.bin --clobber
            gh release download --repo UniqueDroid/PicoRead -p "partitions.bin" -O firmware/picoread/partitions.bin --clobber
            gh release download --repo UniqueDroid/PicoRead -p "firmware.bin" -O firmware/picoread/firmware.bin --clobber
            gh release view --repo UniqueDroid/PicoRead --json tagName -q .tagName > firmware/picoread/VERSION
          else
            echo "No PicoRead release yet - skipping"
          fi

          # PicoWatch ships two hardware variants (V2/ESP32-PICO-D4 and
          # PCB V3/ESP32-S3) in ONE release, distinguished by the
          # "AllFaces-v20.ino*"/"AllFaces-v30.ino*" filename suffix that its
          # release workflows use (many other watchfaces get built too, but
          # only AllFaces - the picker sketch bundling all of them - gets
          # flashed here). Same soft-fail-until-first-release pattern as
          # PicoRead above.
          if gh release view --repo UniqueDroid/PicoWatch >/dev/null 2>&1; then
            mkdir -p firmware/picowatch-v2 firmware/picowatch-v3
            gh release download --repo UniqueDroid/PicoWatch -p "AllFaces-v20.ino.bootloader.bin" -O firmware/picowatch-v2/bootloader.bin --clobber
            gh release download --repo UniqueDroid/PicoWatch -p "AllFaces-v20.ino.partitions.bin" -O firmware/picowatch-v2/partitions.bin --clobber
            gh release download --repo UniqueDroid/PicoWatch -p "AllFaces-v20.ino.bin" -O firmware/picowatch-v2/firmware.bin --clobber
            gh release view --repo UniqueDroid/PicoWatch --json tagName -q .tagName > firmware/picowatch-v2/VERSION
            gh release download --repo UniqueDroid/PicoWatch -p "AllFaces-v30.ino.bootloader.bin" -O firmware/picowatch-v3/bootloader.bin --clobber
            gh release download --repo UniqueDroid/PicoWatch -p "AllFaces-v30.ino.partitions.bin" -O firmware/picowatch-v3/partitions.bin --clobber
            gh release download --repo UniqueDroid/PicoWatch -p "AllFaces-v30.ino.bin" -O firmware/picowatch-v3/firmware.bin --clobber
            gh release view --repo UniqueDroid/PicoWatch --json tagName -q .tagName > firmware/picowatch-v3/VERSION
          else
            echo "No PicoWatch release yet - skipping"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add firmware/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync firmware binaries from latest releases"
            git push
          fi
